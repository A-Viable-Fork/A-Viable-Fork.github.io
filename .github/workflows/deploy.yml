# Deploys the org-root entrance to GitHub Pages. No build step: index.html, style.css, entrance.js,
# and .well-known/assetlinks.json are served exactly as committed. Requires this repository's Pages
# source to be set to "GitHub Actions" (Settings -> Pages); this workflow cannot set that itself.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
